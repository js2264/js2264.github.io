<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
{{ with .Description | default site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
{{ with site.Params.mark }}<link rel="icon" href="{{ . | relURL }}" type="image/svg+xml">{{ end }}
{{ if not (in (slice "light" "dark") site.Params.palette) }}<script src="{{ "assets/chromokit/theme.js" | relURL }}"></script>{{ end }}
<link rel="stylesheet" href="{{ "assets/chromokit/chromokit.css" | relURL }}">
{{ range site.Params.css }}<link rel="stylesheet" href="{{ . | relURL }}">{{ end }}
<script defer src="{{ "assets/chromokit/chromokit.js" | relURL }}"></script>
{{ partial "chromokit/extend-head.html" . }}
