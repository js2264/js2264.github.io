# Build the Hugo site and deploy it to GitHub Pages on every push to master.
# Requires Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch missing citation records
        # Fetches from Crossref the record of any paper of data/papers.yaml that has
        # none in data/citations/ yet, for this build (the committed records, and
        # any correction made to them, are kept as they are). If Crossref cannot
        # be reached, the build goes on and those papers' pages fall back to
        # their short author list.
        continue-on-error: true
        run: python3 scripts/citations.py
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        # baseURL comes from config.yml; build into public/ rather than the legacy docs/
        run: hugo --minify --destination public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # After deploying: every stylesheet and script of a few pages must load from the live
  # site. On jserizay.com, each repository with a Pages site of its own takes the path of its
  # name (jserizay.com/chromokit/ is chromokit's site), so a folder of this site with the
  # same name is never served; the theme's files once were, and the site went unstyled.
  check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: The live pages' stylesheets and scripts load
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        # The query string asks the CDN for this deploy's files, not copies it cached before
        run: |
          site="${SITE%/}"
          fail=0
          for page in / /papers/ /software/; do
            for asset in $(curl -fsSL "${site}${page}?check=${GITHUB_RUN_ID}" | grep -oE '(href|src)="?/[^" >]+\.(css|js)' | sed -E 's/^(href|src)="?//' | sort -u); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${site}${asset}?check=${GITHUB_RUN_ID}")
              echo "$code $asset ($page)"
              [ "$code" = 200 ] || { echo "::error::${asset}, loaded by ${page}, answers ${code}"; fail=1; }
            done
          done
          exit $fail
