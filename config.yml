baseURL: "https://jserizay.com/" 
title: Jacques Serizay
theme: chromokit

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20
  disableAliases: true

# No tags are used: don't publish empty /tags/ pages, nor RSS feeds for sections
disableKinds: ["taxonomy", "term"]
outputs:
    section: ["HTML"]

taxonomies:
    tag: tags

menu:
    main:
        - name: About
          url: about/
          weight: 2
        - name: Papers
          url: papers/
          weight: 3
        - name: Software
          url: software/
          weight: 4
        - name: Courses
          url: courses/
          weight: 5
        - name: Books
          url: books/
          weight: 6
        - name: CV
          url: /cv.pdf
          weight: 8
        # - name: Data
        #   url: data/
        #   weight: 7
        # - name: Blog
        #   url: https://en.wikipedia.org/wiki/Moritz-Maria_von_Igelfeld_(character)
        #   weight: 7

params:
    description: "This website hosts Jacques Serizay's research papers, software packages, course materials, books, curriculum vitae, and contact information."
    author: Jacques Serizay
    # chromokit (themes/chromokit): no bar across the top; the sidebar carries
    # the mark (also the tab's icon), the name, the menu, and at its foot the
    # links. Always the light palette, whatever the reader's system, with no
    # theme toggle (remove `palette` for both). A page's description stays in
    # <head> (search engines, link previews) and is not shown under its title.
    header: false
    palette: light
    showDescription: false
    mark: mark.svg
    css: ["site.css"]
    footer: "Jacques Serizay, CNRS · Institut Pasteur"
    links:
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=e5QTBIAAAAAJ
          icon: googlescholar
        - name: ORCID
          url: https://orcid.org/0000-0002-4295-0624
          icon: orcid
        - name: GitHub
          url: https://github.com/js2264
          icon: github
        - name: Email
          url: mailto:jacques.serizay@pasteur.fr
          icon: mail
    # Who the site is about, for search engines (schema.org Person, on every page:
    # layouts/partials/jsonld.html); the profiles are the `links` above
    person:
        jobTitle: "Research Associate (Chargé de recherche)"
        worksFor:
            - name: Institut Pasteur
              url: https://www.pasteur.fr/
            - name: CNRS
              url: https://www.cnrs.fr/
        alumniOf:
            - name: University of Cambridge
            - name: École Normale Supérieure de Cachan
    # The home page (layouts/index.html): the portrait and the line under the name
    home:
        image: picture.png
        role: "CNRS researcher in genomics, Institut Pasteur, Paris"
    # Default image for link previews (Open Graph / Twitter cards)
    images: ["picture.png"]
    # KaTeX: off site-wide (no page uses math); set `math: true` in a page's front matter if needed
    math: false

# The citation files of each paper (/papers/<id>/<id>.bib and .ris)
mediaTypes:
    application/x-bibtex:
        suffixes: ["bib"]
    application/x-research-info-systems:
        suffixes: ["ris"]

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        # chromokit colours Chroma's classes from its tokens, in both palettes
        noClasses: false
        guessSyntax: true
