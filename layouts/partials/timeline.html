{{- /* Career timeline from data/timeline.yaml (not on any page at the moment: see content/_index.md). */ -}}
<ol class="timeline">
  {{- range $.Site.Data.timeline.items }}
  <li class="timeline__item">
    <span class="timeline__period cx-num">{{ .period }}</span>
    <strong class="timeline__title">{{ .title }}</strong>
    <span class="timeline__description">{{ .description | markdownify }}</span>
  </li>
  {{- end }}
</ol>
