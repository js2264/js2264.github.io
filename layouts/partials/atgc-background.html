<div id="atgc-background" aria-hidden="true"></div>
<div id="atgc-tooltip" hidden></div>

<style>
  #atgc-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--code-bg);
    pointer-events: none;
    line-height: 1.55;
    letter-spacing: 0.14em;
    word-break: break-all;
    padding: 18px 22px;
    font-family: var(--font-mono);
    font-size: 13px;
    opacity: 0;
    transition: opacity 1.2s ease;
    /* The sequence fades out towards the bottom of the screen */
    -webkit-mask-image: linear-gradient(to bottom, #000 45%, rgba(0, 0, 0, 0.2) 100%);
    mask-image: linear-gradient(to bottom, #000 45%, rgba(0, 0, 0, 0.2) 100%);
  }

  #atgc-background.is-ready {
    opacity: 1;
  }

  .atgc-letter {
    cursor: crosshair;
    pointer-events: auto;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  /* Nucleotides, in muted genome-browser colours */
  .atgc-letter.a { color: rgba(64, 145, 98, 0.42); }
  .atgc-letter.c { color: rgba(66, 112, 170, 0.42); }
  .atgc-letter.g { color: rgba(191, 121, 0, 0.45); }
  .atgc-letter.t { color: rgba(186, 82, 70, 0.4); }

  .atgc-letter:hover,
  .atgc-letter.highlight {
    color: rgb(191, 121, 0);
    font-weight: 700;
    background-color: rgba(191, 121, 0, 0.14);
  }

  #atgc-tooltip {
    position: fixed;
    z-index: 10;
    padding: 2px 10px;
    font: 600 12px/1.6 var(--font-mono);
    letter-spacing: 0.08em;
    color: var(--accent-text);
    background: var(--entry);
    border: 1px solid var(--darkcolor);
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, calc(-100% - 8px));
  }

  @media (prefers-reduced-motion: reduce) {
    #atgc-background {
      transition: none;
    }
  }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('atgc-background');
    const tooltip = document.getElementById('atgc-tooltip');
    const K = 5; // length of the k-mer highlighted around the hovered letter

    function render(text) {
        // One span per letter, inserted in a single DOM operation
        const fragment = document.createDocumentFragment();
        const spans = [];
        for (const letter of text) {
            const span = document.createElement('span');
            span.className = 'atgc-letter ' + letter.toLowerCase();
            span.textContent = letter;
            spans.push(span);
            fragment.appendChild(span);
        }
        container.appendChild(fragment);
        requestAnimationFrame(() => container.classList.add('is-ready'));

        // Index the start positions of every k-mer once, so that hovering is a lookup
        const positions = new Map();
        for (let i = 0; i + K <= text.length; i++) {
            const kmer = text.substring(i, i + K);
            if (!positions.has(kmer)) positions.set(kmer, []);
            positions.get(kmer).push(i);
        }
        const indexOf = new Map(spans.map((span, i) => [span, i]));
        let highlighted = [];

        function removeHighlight() {
            highlighted.forEach(span => span.classList.remove('highlight'));
            highlighted = [];
            tooltip.hidden = true;
        }

        // Hovering a letter highlights all occurrences of the k-mer centred on it
        container.addEventListener('mouseover', e => {
            const index = indexOf.get(e.target);
            if (index === undefined) return;
            removeHighlight();
            const start = index - Math.floor(K / 2);
            if (start < 0 || start + K > text.length) return;
            const kmer = text.substring(start, start + K);
            const occurrences = positions.get(kmer);
            for (const p of occurrences) {
                for (let j = p; j < p + K; j++) {
                    spans[j].classList.add('highlight');
                    highlighted.push(spans[j]);
                }
            }
            // Label the k-mer above the hovered letter
            const rect = e.target.getBoundingClientRect();
            tooltip.textContent = `${kmer} · ${occurrences.length}×`;
            tooltip.style.left = `${rect.left + rect.width / 2}px`;
            tooltip.style.top = `${rect.top}px`;
            tooltip.hidden = false;
        });
        container.addEventListener('mouseout', e => {
            if (indexOf.has(e.target)) removeHighlight();
        });
    }

    // Fetch the FASTA file from static directory
    fetch('/errb3b.fa')
        .then(response => {
            if (!response.ok) {
                throw new Error('FASTA file not found');
            }
            return response.text();
        })
        .then(fastaContent => {
            // Parse FASTA: skip header lines (starting with '>') and concatenate sequence lines
            const sequence = fastaContent.split('\n')
                .map(line => line.trim())
                .filter(line => line && !line.startsWith('>'))
                .join('')
                .toUpperCase();
            render(sequence);
        })
        .catch(error => {
            console.error('Error loading FASTA file:', error);
            // Fallback to random letters if file cannot be loaded
            const letters = ['A', 'T', 'G', 'C'];
            let text = '';
            for (let i = 0; i < 5000; i++) {
                text += letters[Math.floor(Math.random() * letters.length)];
            }
            render(text);
        });
    });
</script>
